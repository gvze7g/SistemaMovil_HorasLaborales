<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cuenta de Padre/Madre</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/auth-seguimiento.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="contenedor-app">
    <header class="encabezado-autenticacion">
      <a href="index.html" class="boton-regresar">
        <i class="fas fa-arrow-left"></i>
      </a>
    </header>

    <main class="contenido-principal-autenticacion">
      <div class="envoltorio-contenido">
        <img src="imgs/logo rical.png" alt="Logo Ricaldone" class="logo-empresa" />
        <span class="titulo-principal">Seguimiento de Vehículo</span>
        <p class="descripcion-principal">
          Inicia sesión o crea tu cuenta de padre/madre para ver los vehículos de tu familia dentro del taller
        </p>

        <div class="pestañas-auth" role="tablist">
          <button type="button" class="pestaña-auth activa" id="tabLogin" role="tab" aria-selected="true">
            Iniciar sesión
          </button>
          <button type="button" class="pestaña-auth" id="tabRegister" role="tab" aria-selected="false">
            Crear cuenta
          </button>
        </div>

        <form class="formulario-entrada" id="formLogin">
          <input id="loginEmail" name="loginEmail" placeholder="Correo electrónico" type="email"
            autocomplete="email" required />
          <input id="loginPassword" name="loginPassword" placeholder="Contraseña" type="password"
            autocomplete="current-password" required />
          <button type="submit" class="boton-accion" id="loginBtn">
            Iniciar sesión
          </button>
        </form>

        <form class="formulario-entrada" id="formRegister" style="display: none;">
          <input id="registerFirstName" name="registerFirstName" placeholder="Nombres" type="text"
            autocomplete="given-name" required />
          <input id="registerLastName" name="registerLastName" placeholder="Apellidos" type="text"
            autocomplete="family-name" required />
          <input id="registerEmail" name="registerEmail" placeholder="Correo electrónico" type="email"
            autocomplete="email" required />
          <input id="registerDui" name="registerDui" placeholder="DUI (12345678-9)" type="text" maxlength="10"
            required />
          <input id="registerPassword" name="registerPassword" placeholder="Contraseña (mínimo 8 caracteres)"
            type="password" autocomplete="new-password" required />
          <input id="registerPasswordConfirm" name="registerPasswordConfirm" placeholder="Confirmar contraseña"
            type="password" autocomplete="new-password" required />
          <button type="submit" class="boton-accion" id="registerBtn">
            Crear cuenta
          </button>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="js/auth-seguimiento.js"></script>
</body>

</html>
