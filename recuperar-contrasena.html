<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="contenedor-inicio-sesion">
        <h1 class="titulo-pagina">Recuperación de Contraseña</h1>
        <div class="cabecera-login">
            <img src="imgs/logo rical.png" alt="Logo del Rical" class="logo">
            <h2 class="nombre-sistema">Sistema de Gestión <br> Mantenimiento Automotriz</h2>
            <p class="descripcion-formulario">Ingresa tu correo para enviarte un código de recuperación</p>
        </div>

        <form id="recoveryForm" class="seccion-formulario">
            <div class="grupo-campo" id="stepEmail">
                <label for="email">Correo institucional:</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo institucional" required>
            </div>
            <div class="grupo-campo" id="stepOtp" style="display: none;">
                <label for="otp">Código OTP:</label>
                <input type="text" id="otp" name="otp" inputmode="numeric" maxlength="6" placeholder="Ingresa el código de 6 dígitos">
            </div>
            <div class="grupo-campo" id="stepPassword" style="display: none;">
                <label for="newPassword">Nueva contraseña:</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 8 caracteres">
            </div>
            <div class="grupo-campo" id="stepConfirmPassword" style="display: none;">
                <label for="confirmPassword">Confirmar contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite la nueva contraseña">
            </div>
            <a href="index.html" class="enlace-recuperar-contrasena">Volver al inicio de sesión</a>
            <button type="submit" id="recovery-btn" class="boton-base boton-principal">Enviar código OTP</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <script type="module" src="js/controllers/recoveryController.js"></script>
</body>
</html>
