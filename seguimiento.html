<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Vehículos en el Taller</title>
    <link rel="stylesheet" href="css/seguimiento.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/Modos-claro-oscuro.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
  .galeria-fotos-orden {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 480px;
  }

  .galeria-fotos-orden figure {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .galeria-fotos-orden img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    border: 2px solid var(--status-green);
  }

  .galeria-fotos-orden figcaption {
    font-size: 0.95rem;
    color: var(--text-mid);
    text-align: center;
  }

  @media (min-width: 480px) {
    .galeria-fotos-orden {
      grid-template-columns: repeat(4, 1fr);
    }
  }

  .tarjeta-vehiculo-seguimiento {
    display: flex;
    flex-direction: column;
    gap: 1.2em;
    padding: 1.8em !important;
  }

  .tarjeta-vehiculo-seguimiento .info-vehiculo-texto h2 {
    font-size: 1.6em;
  }

  .tarjeta-vehiculo-seguimiento .info-vehiculo-texto p {
    font-size: 1.05em;
  }

  #listaVehiculos {
    display: flex;
    flex-direction: column;
    gap: 2em;
  }

  .encabezado-seguimiento {
    padding: 1.3em !important;
  }

  .encabezado-seguimiento h1 {
    font-size: 1.3em !important;
  }

  #btnCerrarSesion.boton-volver {
    font-size: 1.05em;
    padding: 0.9em 1.4em;
  }

  .contenedor-barra-progreso {
    height: 22px !important;
  }

  #progressPercentage {
    font-size: 1em !important;
  }

  .elemento-tarea {
    font-size: 1.05em;
    padding: 1.2em 1.4em;
  }

  .seccion-actualizaciones ul li {
    font-size: 1em !important;
    padding: 1em 1.2em !important;
  }

  .estado-vacio,
  .estado-cargando {
    text-align: center;
    color: var(--text-mid);
    padding: 2em 1em;
    font-size: 1.1em;
  }
</style>
  </head>
  <body>
    <div class="contenedor-aplicacion">
      <header class="encabezado-seguimiento">
        <a href="#" id="btnCerrarSesion" class="boton-volver">
          <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </a>
        <h1>Mis Vehículos en el Taller</h1>
      </header>

      <main class="contenido-principal-seguimiento">
        <div id="listaVehiculos">
          <p class="estado-cargando">Cargando tus vehículos...</p>
        </div>
      </main>

      <footer>
        <p>&copy; 2025 Sistema de Gestión de Mantenimiento Automotríz desarrollado por estudiantes de segundo año de bachillerato</p>
      </footer>
    </div>

    <script type="module" src="js/seguimiento.js"></script>
  </body>
</html>
