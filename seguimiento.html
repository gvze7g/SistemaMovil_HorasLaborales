<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mis Vehículos en el Taller</title>
    <link rel="stylesheet" href="css/seguimiento.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="css/Modos-claro-oscuro.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
      .galeria-fotos-orden {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 420px;
      }

      .galeria-fotos-orden figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .galeria-fotos-orden img {
        width: 100%;
        aspect-ratio: 1 / 1;
        object-fit: cover;
        border-radius: 10px;
        border: 2px solid var(--status-green);
      }

      .galeria-fotos-orden figcaption {
        font-size: 0.65rem;
        color: var(--text-mid);
        text-align: center;
      }

      .tarjeta-vehiculo-seguimiento {
        display: flex;
        flex-direction: column;
        gap: 1em;
      }

      #listaVehiculos {
        display: flex;
        flex-direction: column;
        gap: 1.5em;
      }

      .estado-vacio,
      .estado-cargando {
        text-align: center;
        color: var(--text-mid);
        padding: 2em 1em;
      }
    </style>
  </head>
  <body>
    <div class="contenedor-aplicacion">
      <header class="encabezado-seguimiento">
        <a href="#" id="btnCerrarSesion" class="boton-volver">
          <i class="fas fa-sign-out-alt"></i> Cerrar sesión
        </a>
        <h1>Mis Vehículos en el Taller</h1>
      </header>

      <main class="contenido-principal-seguimiento">
        <div id="listaVehiculos">
          <p class="estado-cargando">Cargando tus vehículos...</p>
        </div>
      </main>

      <footer>
        <p>&copy; 2025 Sistema de Gestión de Mantenimiento Automotríz desarrollado por estudiantes de segundo año de bachillerato</p>
      </footer>
    </div>

    <script type="module" src="js/seguimiento.js"></script>
  </body>
</html>
